name: Build APK
# این فایل کل پروژه را درون خودش دارد. هر بار اجرا شود فایل‌ها را می‌سازد و APK درست می‌کند.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          cat > settings.gradle <<'__GYM_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GymPlan"
          __GYM_EOF__
          cat > build.gradle <<'__GYM_EOF__'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'ir.amir.gymplan'
              compileSdk 34

              defaultConfig {
                  applicationId 'ir.amir.gymplan'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          __GYM_EOF__
          cat > gradle.properties <<'__GYM_EOF__'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          __GYM_EOF__
          mkdir -p src/main
          cat > src/main/AndroidManifest.xml <<'__GYM_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="AmirSet"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density|layoutDirection|locale"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __GYM_EOF__
          mkdir -p src/main/java/ir/amir/gymplan
          cat > src/main/java/ir/amir/gymplan/MainActivity.java <<'__GYM_EOF__'
          package ir.amir.gymplan;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private static final int REQ_CAMERA = 11;
              private static final int REQ_FILE = 12;
              private static final String HOME = "https://appassets.androidplatform.net/assets/index.html";

              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingRequest;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Keep the screen on so the rest timer and its bell keep running.
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  boolean wantsCamera = false;
                                  for (String r : request.getResources()) {
                                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) {
                                          wantsCamera = true;
                                      }
                                  }
                                  if (!wantsCamera) {
                                      request.deny();
                                      return;
                                  }
                                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                                  } else {
                                      pendingRequest = request;
                                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                                  }
                              }
                          });
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadUrl(HOME);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_CAMERA && pendingRequest != null) {
                      boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (ok) {
                          pendingRequest.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                      } else {
                          pendingRequest.deny();
                      }
                      pendingRequest = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("window.__back ? window.__back() : false", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if (!"true".equals(value)) {
                              finish();
                          }
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          __GYM_EOF__
          mkdir -p src/main/res/mipmap-anydpi-v26
          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'__GYM_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          __GYM_EOF__
          mkdir -p src/main/res/drawable
          cat > src/main/res/drawable/ic_fg.xml <<'__GYM_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E2A15A" android:pathData="M0,0h108v108h-108z" />
              <group android:scaleX="0.15" android:scaleY="0.15" android:translateX="15.6" android:translateY="15">
                  <path
                      android:pathData="M140,398 L256,120 L372,398"
                      android:strokeColor="#15181C"
                      android:strokeWidth="34"
                      android:strokeLineCap="square"
                      android:strokeLineJoin="miter" />
                  <path android:fillColor="#15181C" android:pathData="M120,288h272v16h-272z" />
                  <path android:fillColor="#15181C" android:pathData="M92,244h34v104h-34z" />
                  <path android:fillColor="#15181C" android:pathData="M130,262h22v68h-22z" />
                  <path android:fillColor="#15181C" android:pathData="M386,244h34v104h-34z" />
                  <path android:fillColor="#15181C" android:pathData="M360,262h22v68h-22z" />
              </group>
          </vector>
          __GYM_EOF__
          mkdir -p src/main/assets
          cat > src/main/assets/index.html <<'__GYM_EOF__'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="color-scheme" content="light dark">
          <title>AmirSet</title>
          <style>
          :root{
            --bg:#EDEFF1; --surface:#FFFFFF; --ink:#15181C; --muted:#5A616B; --line:#D8DCE1;
            --accent:#A35B1B; --accent-ink:#FFFFFF; --accent-soft:#F3E6D8;
            --ok:#1C7656; --ok-ink:#FFFFFF; --warn:#965600; --danger:#B3261E;
            --f-body:system-ui,'Noto Sans Arabic','Vazirmatn',Tahoma,sans-serif;
          }
          @media (prefers-color-scheme: dark){
            :root:not([data-theme="light"]){
              --bg:#0F1114; --surface:#171A1F; --ink:#ECEEF0; --muted:#98A0AA; --line:#2A2F37;
              --accent:#E2A15A; --accent-ink:#1A1004; --accent-soft:#2B2217;
              --ok:#52C79E; --ok-ink:#07241B; --warn:#E0B25A; --danger:#F2867E; color-scheme:dark;
            }
          }
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          [hidden]{display:none!important}
          html{background:var(--bg)}
          body{
            margin:0; background:var(--bg); color:var(--ink);
            font-family:var(--f-body); font-size:15px; line-height:1.7;
            padding-block:16px 170px;
            padding-left:max(16px,env(safe-area-inset-left,0px));
            padding-right:max(16px,env(safe-area-inset-right,0px));
          }
          button,input,textarea{font-family:inherit}
          :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
          .wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
          .brand{letter-spacing:.18em;font-size:11.5px;color:var(--accent);direction:ltr;text-align:right;font-weight:700}
          h1{margin:2px 0 0;font-size:26px;font-weight:800;line-height:1.35;text-wrap:balance}
          h2{margin:0;font-size:17px;font-weight:800}
          p{margin:0}
          .lead,.muted{color:var(--muted);font-size:13.5px}

          .nav{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
          .nav button{border:0;background:transparent;color:var(--muted);padding:9px 6px;font-size:14px;font-weight:700;cursor:pointer}
          .nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

          .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
          .tab{flex:none;min-width:96px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;line-height:1.45;font-size:14px;font-weight:700}
          .tab small{font-size:11.5px;font-weight:400;color:var(--muted);text-align:center;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
          .tab[aria-selected="true"] small{color:inherit;opacity:.78}
          .tab.add{min-width:64px;border-style:dashed;color:var(--accent)}

          .sumrow{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--muted);font-size:13px}
          .sumrow b{color:var(--ink);font-weight:700}
          .progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
          .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

          .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
          .ctrl-r{display:flex;gap:8px}
          .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
          .seg button{font-size:13px;border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
          .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
          .link{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
          .link[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
          .link.danger{color:var(--danger);border-color:var(--danger)}
          .note{font-size:13px;color:var(--warn);border:1px dashed var(--warn);border-radius:10px;padding:8px 12px}

          .btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;min-height:44px;font-size:14.5px;font-weight:700;cursor:pointer}
          .btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
          .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
          .btn.small{min-height:36px;padding:6px 12px;font-size:13px}
          .btn:disabled{opacity:.5;cursor:default}
          .row{display:flex;flex-wrap:wrap;gap:8px}
          .row>.btn{flex:1 1 140px}

          .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
          .ex,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
          .panel{padding:14px}
          .ex.is-done{opacity:.6}
          .ex-head{display:flex;gap:10px;align-items:flex-start}
          .ex-n{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);margin-top:2px}
          .ex-title{min-width:0;flex:1}
          h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.55;overflow-wrap:anywhere}
          .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
          .chip{font-size:11.5px;line-height:1.7;padding:0 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
          .chip.rest{background:transparent;border:1px solid var(--line);color:var(--muted)}
          .chip.q{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
          .chip.on{background:var(--ok);color:var(--ok-ink)}
          .hint{font-size:12px;color:var(--muted)}
          .sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
          .set{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:6px 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.35}
          .set .sn{font-size:11.5px}
          .set .sr{font-size:15px;font-weight:700;color:var(--ink)}
          .set.next{border-color:var(--accent);background:var(--accent-soft)}
          .set.next .sr{color:var(--accent)}
          .set.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
          .set.done .sr{color:var(--ok-ink)}

          .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
          .fld{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);min-width:0}
          .fld.full{grid-column:1/-1}
          .inp,.fld input,.fld textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
          textarea.inp,.fld textarea{min-height:200px;line-height:1.8;resize:vertical}
          .edit-tools{display:flex;flex-wrap:wrap;gap:6px}
          .dayedit{display:flex;flex-direction:column;gap:8px}

          .pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start}
          .pcard.on{border-color:var(--accent)}
          .pcard img{width:64px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
          .pbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
          .pbody h3{font-size:16px}
          .shot{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);object-fit:contain;align-self:center}
          .daybox{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
          .daybox summary{cursor:pointer;font-weight:700}
          .daybox ol{margin:6px 0 2px;padding-inline-start:22px;color:var(--muted);font-size:13.5px}
          .daybox li b{color:var(--ink);font-weight:500}
          .thumbs{display:flex;gap:8px;flex-wrap:wrap}
          .thumb{position:relative;width:96px;height:128px}
          .thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
          .thumb .x{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:18px;line-height:1;cursor:pointer}
          .info{font-size:13px;color:var(--muted)}
          .info.err{color:var(--danger)}
          .info.ok{color:var(--ok)}
          pre{margin:6px 0 0;padding:10px;background:var(--bg);border-radius:8px;font-size:12.5px;line-height:1.8;white-space:pre-wrap;direction:rtl;overflow-x:auto}
          details summary{cursor:pointer;color:var(--accent);font-size:13.5px}

          table{border-collapse:collapse;width:100%;font-size:13.5px}
          th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
          th{font-weight:500;color:var(--muted);font-size:12px}
          td:last-child{white-space:nowrap;font-weight:700}
          .tw{overflow-x:auto}

          .cam{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
          .cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
          .cam-bar{display:flex;gap:10px;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
          .cam-bar button{min-width:120px}
          .cam .shutter{background:#fff;color:#000}
          .cam .cancel{color:#fff;border-color:#666}
          .cam-msg{color:#fff;text-align:center;padding:10px 16px;font-size:14px}

          .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);
            padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
          .dock-in{max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px;min-height:64px}
          .ring{position:relative;flex:none;width:64px;height:64px}
          .ring svg{display:block}
          .ring circle{fill:none;stroke-width:5}
          .ring .trk{stroke:var(--line)}
          .ring .arc{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:163.36;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:50% 50%}
          .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
          .dock-txt{flex:1;min-width:0}
          .dt1{font-weight:800;font-size:15px;line-height:1.5}
          .dt2{font-size:12.5px;color:var(--muted);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .dock-btns{display:flex;gap:6px}
          .dock-btns button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;min-height:40px;font-size:13px;font-weight:700;cursor:pointer}
          .dock[data-state="idle"] .ring,.dock[data-state="idle"] .dock-btns{display:none}
          .dock[data-state="done"] #b-m,.dock[data-state="done"] #b-p{display:none}
          .dock[data-state="done"]{background:var(--accent);color:var(--accent-ink);border-top-color:var(--accent)}
          .dock[data-state="done"] .dt2{color:inherit;opacity:.85}
          .dock[data-state="done"] .ring .trk{stroke:rgba(255,255,255,.35)}
          .dock[data-state="done"] .ring .arc{stroke:var(--accent-ink)}
          .dock[data-state="done"] .dock-btns button{border-color:var(--accent-ink);color:var(--accent-ink)}
          @media (prefers-reduced-motion: no-preference){
            .dock[data-state="done"]{animation:pulse .9s ease-in-out 4}
            @keyframes pulse{50%{filter:brightness(1.18)}}
          }
          @media (max-width:380px){.fields{grid-template-columns:1fr 1fr}}
          </style>
          </head>
          <body>
          <div class="wrap" id="app"></div>

          <div class="cam" id="cam" hidden>
            <div class="cam-msg" id="cam-msg">برگه را کامل و صاف داخل کادر بگیر.</div>
            <video id="cam-v" autoplay playsinline muted></video>
            <div class="cam-bar">
              <button type="button" class="btn alt cancel" id="cam-x">بستن</button>
              <button type="button" class="btn shutter" id="cam-go">عکس بگیر</button>
            </div>
          </div>

          <input type="file" id="pick" accept="image/*" hidden>

          <div class="dock" id="dock" data-state="idle">
            <div class="dock-in">
              <div class="ring">
                <svg viewBox="0 0 60 60" width="64" height="64" aria-hidden="true">
                  <circle class="trk" cx="30" cy="30" r="26"/>
                  <circle class="arc" id="arc" cx="30" cy="30" r="26"/>
                </svg>
                <span id="clock">۰:۰۰</span>
              </div>
              <div class="dock-txt" aria-live="polite">
                <div class="dt1" id="dt1">تایمر استراحت</div>
                <div class="dt2" id="dt2">بعد از تأیید هر ست خودکار شروع می‌شود</div>
              </div>
              <div class="dock-btns">
                <button type="button" id="b-m" aria-label="پانزده ثانیه کمتر">−۱۵</button>
                <button type="button" id="b-p" aria-label="پانزده ثانیه بیشتر">+۱۵</button>
                <button type="button" id="b-x">رد کردن</button>
              </div>
            </div>
          </div>

          <script>
          (function(){
          'use strict';

          /* ---------- helpers ---------- */
          var FA='۰۱۲۳۴۵۶۷۸۹';
          function fa(s){return String(s).replace(/\d/g,function(d){return FA[d]})}
          function lat(s){return String(s).replace(/[۰-۹]/g,function(d){return FA.indexOf(d)}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})}
          function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
          function $(id){return document.getElementById(id)}
          function clone(o){return JSON.parse(JSON.stringify(o))}
          function mmss(s){s=Math.max(0,Math.ceil(s));return fa(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'))}
          function pdate(ms,opt){
            try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',opt||{day:'numeric',month:'long',year:'numeric'}).format(new Date(ms))}
            catch(e){return new Date(ms).toLocaleDateString()}
          }
          function monthName(ms){return pdate(ms,{month:'long',year:'numeric'})}

          /* ---------- storage ---------- */
          var KEY='gymplan-v2';
          var d0=new Date();
          var today=d0.getFullYear()+'-'+(d0.getMonth()+1)+'-'+d0.getDate();
          function seed(){
            return {programs:[],activeId:null,dayIx:0,mode:'full',apiKey:'',doneDate:today,done:{}};
          }
          function load(){
            try{
              var r=JSON.parse(localStorage.getItem(KEY)||'null');
              if(r&&Array.isArray(r.programs)){
                if(r.doneDate!==today){r.done={};r.doneDate=today}
                r.programs.forEach(function(p){if(!p.photos){p.photos=p.photo?[p.photo]:[];delete p.photo}});
                return r;
              }
            }catch(e){}
            return seed();
          }
          var DB=load();
          function save(){
            for(var tries=0;tries<50;tries++){
              try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){
                var drop=null;
                DB.programs.slice().sort(function(a,b){return a.created-b.created}).some(function(p){if(p.photos&&p.photos.length){drop=p;return true}});
                if(!drop)return false;
                drop.photos=[];
              }
            }
            return false;
          }
          function cur(){
            for(var i=0;i<DB.programs.length;i++)if(DB.programs[i].id===DB.activeId)return DB.programs[i];
            return DB.programs[0]||null;
          }
          function curDay(){
            var p=cur();
            if(DB.dayIx>=p.days.length)DB.dayIx=Math.max(0,p.days.length-1);
            return p.days[DB.dayIx];
          }
          function items(){return curDay().items}
          function dkey(i){return cur().id+'|'+DB.dayIx+'|'+i}
          function doneOf(i){return DB.done[dkey(i)]||0}

          /* ---------- rest logic ---------- */
          function guessRest(name,reps,tag){
            var first=parseInt(lat(String(reps)).split(/[+\-]/)[0],10)||10;
            if(/ساق|شکم|ساعد|مچ/.test(name))return 45;
            if(/اسکات|ددلیفت|لانج|پرس پا|هیپ/.test(name))return first<=8?150:120;
            if(/پرس|بالاسینه|زیربغل|بارفیکس|پارالل|روئینگ|هالتر/.test(name)&&!/بازو|نشر/.test(name)){
              if(first<=8)return 150;
              if(/زیربغل/.test(name)&&!/هالتر/.test(name))return 90;
              return 120;
            }
            if(tag)return 75;
            return 60;
          }
          function restOf(it){var r=DB.mode==='fast'?it.rest*0.75:it.rest;return Math.max(30,Math.round(r/5)*5)}
          function nparts(it){return String(it.reps).split('+').length}
          function repsText(it){return fa(String(it.reps).split('+').join(' + '))}
          function est(its){
            var s=0;
            its.forEach(function(it){s+=it.sets*(15+35*nparts(it))+Math.max(0,it.sets-1)*restOf(it)});
            s+=Math.max(0,its.length-1)*45;
            return Math.max(5,Math.round(s/300)*5);
          }

          /* ---------- text <-> plan ---------- */
          function parsePlan(text){
            var days=[],day=null;
            function ensure(name){day={name:name||('روز '+fa(days.length+1)),items:[]};days.push(day)}
            String(text||'').split(/\r?\n/).forEach(function(raw){
              var line=lat(raw).replace(/[‌‏‎]/g,function(c){return c==='‌'?'‌':''}).trim();
              if(!line)return;
              var md=line.match(/^(?:روز\s*\d+|#+)\s*[:：\-–]?\s*(.*)$/);
              if(md){ensure(md[1].trim());return}
              var q=/[؟?]\s*$/.test(line);
              line=line.replace(/[؟?]\s*$/,'').trim();
              var m=line.match(/(\d+)\s*[x×*✕]\s*(\d+(?:\s*[-+]\s*\d+)*)/i);
              var sets=3,reps='10',name=line;
              if(m){
                sets=Math.min(12,Math.max(1,parseInt(m[1],10)));
                reps=m[2].replace(/\s+/g,'');
                if(/^(\d+)(?:-\1)+$/.test(reps))reps=reps.replace(/-/g,'+');
                name=(line.slice(0,m.index)+' '+line.slice(m.index+m[0].length)).trim();
              }else q=true;
              name=name.replace(/^\s*\d+\s*[.)\-–]\s+/,'').replace(/^[\s\-–:|،,.]+/,'').replace(/[\s\-–:|،,]+$/,'').trim();
              if(!name)return;
              if(!day)ensure('');
              var tag='';
              if(/\//.test(name))tag='سوپرست';
              else{var np=reps.split('+').length;if(np===2)tag='دو حالته';else if(np>=3)tag='سه حالته'}
              var it={n:name,sets:sets,reps:reps,rest:guessRest(name,reps,tag)};
              if(tag)it.tag=tag;
              if(q)it.q=1;
              day.items.push(it);
            });
            return days.filter(function(d){return d.items.length});
          }
          function planInfo(text){
            var d=parsePlan(text),n=0;
            d.forEach(function(x){n+=x.items.length});
            if(!n)return {t:'هنوز حرکتی خوانده نشد.',cls:''};
            return {t:fa(d.length)+' روز و '+fa(n)+' حرکت شناسایی شد.',cls:'ok'};
          }

          /* ---------- state ---------- */
          var view='train';
          var edit=false;
          var armed='';
          var armT=0;
          var DRAFT=freshDraft();
          function freshDraft(){return {name:monthName(Date.now()),text:'',photos:[],busy:false,msg:'',err:false}}
          var app=$('app');

          function arm(k){
            if(armed===k)return true;
            armed=k;clearTimeout(armT);
            armT=setTimeout(function(){armed='';render()},4000);
            return false;
          }

          /* ---------- views ---------- */
          function headerHtml(){
            var p=cur();
            return '<header><div class="brand">AMIRSET</div><h1>'+esc(p?p.name:'AmirSet')+'</h1></header>'+
              '<nav class="nav" aria-label="بخش‌ها"><button type="button" data-act="nav" data-v="train" aria-pressed="'+(view==='train')+'">تمرین</button>'+
              '<button type="button" data-act="nav" data-v="programs" aria-pressed="'+(view!=='train')+'">برنامه‌ها</button></nav>';
          }

          function emptyHtml(){
            return '<section class="panel"><h2>هنوز برنامه‌ای نداری</h2><p class="lead">برگه‌ی برنامه‌ی باشگاهت را عکس بگیر (تا سه عکس) یا حرکت‌ها را تایپ کن. بعد از ساخت برنامه، هر ست یک دکمه دارد و با زدنش تایمر استراحت شروع می‌شود.</p><button type="button" class="btn" data-act="new">ساخت اولین برنامه</button></section>';
          }
          function trainHtml(){
            if(!cur())return emptyHtml();
            var p=cur(),its=items(),total=0,done=0,anyQ=false;
            its.forEach(function(it,i){total+=it.sets;done+=Math.min(it.sets,doneOf(i));if(it.q)anyQ=true});
            var h='<div class="tabs" role="tablist" aria-label="روزهای تمرین">';
            p.days.forEach(function(d,i){
              h+='<button type="button" class="tab" role="tab" data-act="day" data-i="'+i+'" aria-selected="'+(i===DB.dayIx)+'"><span>روز '+fa(i+1)+'</span><small>'+esc(d.name)+'</small></button>';
            });
            if(edit)h+='<button type="button" class="tab add" data-act="addDay" aria-label="افزودن روز"><span>+ روز</span></button>';
            h+='</div>';
            h+='<div class="sumrow"><span><b>'+fa(its.length)+'</b> حرکت</span><span><b>'+fa(done)+'</b> از <b>'+fa(total)+'</b> ست</span><span>حدود <b>'+fa(est(its))+'</b> دقیقه</span></div>';
            h+='<div class="progress"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>';
            h+='<div class="ctrl"><div class="seg" role="group" aria-label="مدت استراحت">'+
              '<button type="button" data-act="mode" data-m="full" aria-pressed="'+(DB.mode==='full')+'">استراحت استاندارد</button>'+
              '<button type="button" data-act="mode" data-m="fast" aria-pressed="'+(DB.mode==='fast')+'">فشرده</button></div>'+
              '<div class="ctrl-r"><button type="button" class="link" data-act="reset">از اول</button>'+
              '<button type="button" class="link" data-act="edit" aria-pressed="'+edit+'">'+(edit?'پایان ویرایش':'ویرایش')+'</button></div></div>';
            if(anyQ)h+='<p class="note">حرکت‌های دارای برچسب «نیاز به تأیید» را باید یک بار چک کنی. با دکمه‌ی ویرایش اصلاحشان کن.</p>';
            if(edit){
              h+='<div class="panel dayedit"><label class="fld">نام این روز<input type="text" id="dn" data-act-in="dayname" value="'+esc(curDay().name)+'"></label>'+
                '<div class="edit-tools"><button type="button" class="btn small '+(armed==='delday'?'danger':'alt')+'" data-act="delDay">'+(armed==='delday'?'برای حذف روز دوباره بزن':'حذف این روز')+'</button></div></div>';
            }
            h+='<ol class="list">';
            its.forEach(function(it,i){
              var c=doneOf(i),full=c>=it.sets,sets='';
              for(var s=0;s<it.sets;s++){
                var cls=s<c?'done':(s===c?'next':'');
                sets+='<button type="button" class="set '+cls+'" data-act="set" data-i="'+i+'" data-s="'+s+'" aria-label="ست '+fa(s+1)+(s<c?' انجام شد':'')+'"><span class="sn">'+(s<c?'✓ ':'')+'ست '+fa(s+1)+'</span><span class="sr">'+repsText(it)+'</span></button>';
              }
              var hint='';
              if(it.tag==='سوپرست')hint='هر دو حرکت پشت‌سر هم، استراحت فقط بعد از جفت.';
              else if(it.tag==='دو حالته'||it.tag==='سه حالته')hint='حالت‌ها پشت‌سر هم، استراحت بعد از آخرین حالت.';
              var f='';
              if(edit){
                f='<div class="fields">'+
                  '<label class="fld full">نام حرکت<input type="text" id="f'+i+'n" data-f="n" data-i="'+i+'" value="'+esc(it.n)+'"></label>'+
                  '<label class="fld">تعداد ست<input type="text" inputmode="numeric" id="f'+i+'s" data-f="sets" data-i="'+i+'" value="'+fa(it.sets)+'"></label>'+
                  '<label class="fld">تکرار (با + جدا کن)<input type="text" id="f'+i+'r" data-f="reps" data-i="'+i+'" value="'+esc(fa(it.reps))+'"></label>'+
                  '<label class="fld">استراحت (ثانیه)<input type="text" inputmode="numeric" id="f'+i+'t" data-f="rest" data-i="'+i+'" value="'+fa(it.rest)+'"></label></div>'+
                  '<div class="edit-tools"><button type="button" class="btn small alt" data-act="up" data-i="'+i+'">بالا</button>'+
                  '<button type="button" class="btn small alt" data-act="down" data-i="'+i+'">پایین</button>'+
                  '<button type="button" class="btn small '+(armed==='del'+i?'danger':'alt')+'" data-act="delEx" data-i="'+i+'">'+(armed==='del'+i?'برای حذف دوباره بزن':'حذف حرکت')+'</button></div>';
              }
              h+='<li class="ex'+(full?' is-done':'')+'"><div class="ex-head"><span class="ex-n">'+fa(i+1)+'</span><div class="ex-title"><h3>'+esc(it.n)+'</h3>'+
                '<div class="chips">'+(it.tag?'<span class="chip">'+esc(it.tag)+'</span>':'')+'<span class="chip rest">استراحت '+mmss(restOf(it))+'</span>'+(it.q?'<span class="chip q">نیاز به تأیید</span>':'')+'</div></div></div>'+
                (hint?'<p class="hint">'+hint+'</p>':'')+'<div class="sets">'+sets+'</div>'+f+'</li>';
            });
            h+='</ol>';
            if(edit)h+='<button type="button" class="btn alt" data-act="addEx">+ افزودن حرکت</button>';
            h+='<section class="panel"><h2>استراحت بین ست‌ها</h2><div class="tw"><table><thead><tr><th>نوع حرکت</th><th>استراحت</th></tr></thead><tbody>'+
              '<tr><td>پرس و اسکات سنگین، حدود ۸ تکرار</td><td>۲:۳۰</td></tr>'+
              '<tr><td>مرکب با ۱۰ تا ۱۲ تکرار</td><td>۱:۳۰ تا ۲:۰۰</td></tr>'+
              '<tr><td>سوپرست و حالت‌های ترکیبی</td><td>۱:۰۰ تا ۱:۱۵</td></tr>'+
              '<tr><td>تک‌مفصلی</td><td>۱:۰۰</td></tr>'+
              '<tr><td>ساق و شکم</td><td>۰:۴۵</td></tr></tbody></table></div>'+
              '<p class="lead">حالت فشرده همه‌ی استراحت‌ها را ۲۵ درصد کوتاه می‌کند. صفحه‌ی گوشی در این برنامه روشن می‌ماند تا زنگ از دست نرود.</p></section>';
            return h;
          }

          function countInfo(p){var n=0;p.days.forEach(function(d){n+=d.items.length});return fa(p.days.length)+' روز، '+fa(n)+' حرکت'}
          function range(p){return pdate(p.created)+(p.archived?' تا '+pdate(p.archived):'')}

          function programsHtml(){
            var h='<button type="button" class="btn" data-act="new">برنامه‌ی جدید</button>';
            var a=cur();
            if(a)h+='<h2>برنامه‌ی فعال</h2>'+pcard(a,true);
            var arch=DB.programs.filter(function(p){return !a||p.id!==a.id}).sort(function(x,y){return y.created-x.created});
            h+='<h2>آرشیو</h2>';
            if(!arch.length)h+='<p class="lead">وقتی برنامه‌ی جدید بسازی، برنامه‌ی قبلی اینجا ذخیره می‌شود.</p>';
            arch.forEach(function(p){h+=pcard(p,false)});
            h+='<section class="panel"><h2>خواندن عکس با هوش مصنوعی</h2>'+
              '<p class="lead">برای خواندن خودکار عکس برگه به یک کلید API از Anthropic نیاز داری. کلید فقط روی همین گوشی می‌ماند و هزینه‌ی هر عکس از حساب API خودت کم می‌شود. بدون کلید هم می‌توانی برنامه را تایپ کنی.</p>'+
              '<label class="fld">کلید API<input type="password" id="akey" dir="ltr" autocomplete="off" placeholder="sk-ant-..." value="'+esc(DB.apiKey||'')+'"></label>'+
              '<div class="row"><button type="button" class="btn alt" data-act="saveKey">ذخیره‌ی کلید</button></div><p class="info" id="kinfo">'+(DB.apiKey?'کلید ذخیره شده است.':'کلیدی ذخیره نشده است.')+'</p></section>';
            return h;
          }
          function pcard(p,on){
            var h='<div class="pcard'+(on?' on':'')+'">'+(p.photos&&p.photos.length?'<img src="'+p.photos[0]+'" alt="عکس برگه">':'')+
              '<div class="pbody"><h3>'+esc(p.name)+(on?' <span class="chip on">فعال</span>':'')+'</h3><p class="muted">'+range(p)+' · '+countInfo(p)+'</p><div class="row">'+
              '<button type="button" class="btn alt small" data-act="viewP" data-id="'+p.id+'">مشاهده</button>';
            if(!on)h+='<button type="button" class="btn alt small" data-act="activate" data-id="'+p.id+'">فعال‌سازی</button>'+
              '<button type="button" class="btn small '+(armed==='p'+p.id?'danger':'alt')+'" data-act="delP" data-id="'+p.id+'">'+(armed==='p'+p.id?'برای حذف دوباره بزن':'حذف')+'</button>';
            return h+'</div></div></div>';
          }

          function viewHtml(id){
            var p=null;DB.programs.forEach(function(x){if(x.id===id)p=x});
            if(!p)return '<p class="lead">این برنامه پیدا نشد.</p>';
            var h='<button type="button" class="btn alt small" data-act="back" style="align-self:flex-start">بازگشت</button><section class="panel"><h2>'+esc(p.name)+'</h2><p class="muted">'+range(p)+' · '+countInfo(p)+'</p>';
            (p.photos||[]).forEach(function(ph,i){h+='<img class="shot" src="'+ph+'" alt="عکس برگه '+fa(i+1)+'">'});
            p.days.forEach(function(d,i){
              h+='<details class="daybox"'+(i===0?' open':'')+'><summary>روز '+fa(i+1)+': '+esc(d.name)+'</summary><ol>';
              d.items.forEach(function(it){h+='<li><b>'+esc(it.n)+'</b> — '+fa(it.sets)+'×'+repsText(it)+'</li>'});
              h+='</ol></details>';
            });
            return h+'</section>';
          }

          var HELP='روز ۱: سینه و زیربغل\nقفسه سینه دستگاه ۴×۱۰+۱۰\nبالاسینه هالتر / قفسه دمبل ۳×۱۲+۱۰\nپرس سینه دمبل ۴×۸\n\nروز ۲: شانه\nپرس سرشانه دمبل ۳×۱۰';
          function newHtml(){
            var D=DRAFT,info=planInfo(D.text);
            var h='<button type="button" class="btn alt small" data-act="back" style="align-self:flex-start">بازگشت</button><section class="panel"><h2>برنامه‌ی جدید</h2>'+
              '<p class="lead">'+(cur()?'با ساخته شدن برنامه‌ی جدید، برنامه‌ی «'+esc(cur().name)+'» با همه‌ی حرکت‌ها در آرشیو می‌ماند.':'برگه‌ات را عکس بگیر (تا سه عکس) یا حرکت‌ها را در کادر پایین تایپ کن.')+'</p>'+
              '<label class="fld">نام برنامه<input type="text" id="nname" value="'+esc(D.name)+'"></label>'+
              '<div class="row"><button type="button" class="btn" data-act="cam">گرفتن عکس برگه'+(D.photos.length?' ('+fa(D.photos.length)+' از ۳)':'')+'</button><button type="button" class="btn alt" data-act="pick">انتخاب از گالری</button></div>';
            if(D.photos.length){
              h+='<div class="thumbs">';
              D.photos.forEach(function(ph,i){h+='<div class="thumb"><img src="'+ph.small+'" alt="عکس '+fa(i+1)+'"><button type="button" class="x" data-act="rmPhoto" data-i="'+i+'" aria-label="حذف عکس '+fa(i+1)+'">×</button></div>'});
              h+='</div><div class="row"><button type="button" class="btn" data-act="ai"'+(D.busy?' disabled':'')+'>'+(D.busy?'در حال خواندن…':(D.photos.length>1?'خواندن عکس‌ها با هوش مصنوعی':'خواندن عکس با هوش مصنوعی'))+'</button></div>';
            }
            if(D.msg)h+='<p class="info'+(D.err?' err':'')+'">'+esc(D.msg)+'</p>';
            h+='<label class="fld">متن برنامه (بعد از خواندن عکس اینجا اصلاحش کن یا خودت تایپ کن)<textarea id="ntext" placeholder="روز ۱: سینه&#10;پرس سینه دمبل ۴×۱۰">'+esc(D.text)+'</textarea></label>'+
              '<p class="info '+info.cls+'" id="ninfo">'+info.t+'</p>'+
              '<details><summary>قالب نوشتن برنامه</summary><pre>'+esc(HELP)+'</pre><p class="lead">هر خط یک حرکت است: نام، بعد ست×تکرار. علامت / بین دو حرکت یعنی سوپرست. ۱۰+۱۰ یعنی دو حالت پشت‌سر هم. آخر خطی که مطمئن نیستی ؟ بگذار. هر خط «روز N: نام» یک روز جدید شروع می‌کند.</p></details>'+
              '<div class="row"><button type="button" class="btn" data-act="make">ساخت برنامه</button></div></section>';
            return h;
          }

          function syncDock(){
            var idle=dock.dataset.state==='idle';
            dock.hidden=(view!=='train'&&idle);
          }

          function render(){
            var h=headerHtml();
            if(view==='train')h+=trainHtml();
            else if(view==='programs')h+=programsHtml();
            else if(view==='new')h+=newHtml();
            else if(view.indexOf('view:')===0)h+=viewHtml(view.slice(5));
            app.innerHTML=h;
            syncDock();
          }

          /* ---------- sound, wake lock ---------- */
          var AC=null;
          function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
          function tone(f,t0,dur,vol){
            if(!AC)return;
            try{
              var o=AC.createOscillator(),g=AC.createGain();
              o.type='sine';o.frequency.value=f;
              g.gain.setValueAtTime(0.0001,t0);
              g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
              g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
              o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.05);
            }catch(e){}
          }
          function bell(){
            if(AC){var t=AC.currentTime;[0,0.4,0.8].forEach(function(o){tone(880,t+o,0.32,0.4);tone(1318,t+o,0.32,0.18)})}
            try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,300])}catch(e){}
          }
          function tickSound(){if(AC)tone(660,AC.currentTime,0.09,0.18)}

          /* ---------- rest timer ---------- */
          var dock=$('dock'),$clock=$('clock'),arc=$('arc'),dt1=$('dt1'),dt2=$('dt2'),bx=$('b-x');
          var CIRC=163.36,T=null;
          function setIdle(a,b){
            dock.dataset.state='idle';
            dt1.textContent=a||'تایمر استراحت';
            dt2.textContent=b||'بعد از تأیید هر ست خودکار شروع می‌شود';
            syncDock();
          }
          function stopRest(a,b){if(T&&T.iv)clearInterval(T.iv);T=null;setIdle(a,b)}
          function startRest(sec,after,next){
            if(T&&T.iv)clearInterval(T.iv);
            T={end:Date.now()+sec*1000,total:sec,last:0,ringing:false,iv:0,nextText:next?'بعدی: '+next:''};
            dock.dataset.state='run';dock.hidden=false;
            bx.textContent='رد کردن';
            dt1.textContent='استراحت بعد از '+after;
            dt2.textContent=T.nextText;
            T.iv=setInterval(tick,200);tick();
          }
          function tick(){
            if(!T||T.ringing)return;
            var rem=(T.end-Date.now())/1000;
            if(rem<=0){ring();return}
            var c=Math.ceil(rem);
            $clock.textContent=mmss(rem);
            arc.style.strokeDashoffset=String(CIRC*(1-Math.min(1,rem/T.total)));
            if(c<=3&&c!==T.last){T.last=c;tickSound()}
          }
          function ring(){
            if(!T)return;
            clearInterval(T.iv);T.iv=0;T.ringing=true;
            dock.dataset.state='done';dock.hidden=false;
            $clock.textContent=mmss(0);
            arc.style.strokeDashoffset=String(CIRC);
            dt1.textContent='استراحت تمام شد';
            dt2.textContent=T.nextText||'ست بعدی را شروع کن';
            bx.textContent='باشه';
            bell();
          }
          $('b-m').addEventListener('click',function(){if(!T||T.ringing)return;T.end-=15000;T.total=Math.max(15,T.total-15);tick()});
          $('b-p').addEventListener('click',function(){if(!T||T.ringing)return;T.end+=15000;T.total+=15;tick()});
          bx.addEventListener('click',function(){stopRest()});
          document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

          /* ---------- images, camera, AI ---------- */
          function toJpeg(src,maxSide,q){
            return new Promise(function(res){
              var im=new Image();
              im.onload=function(){
                var w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,maxSide/Math.max(w,h));
                var c=document.createElement('canvas');
                c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
                c.getContext('2d').drawImage(im,0,0,c.width,c.height);
                res(c.toDataURL('image/jpeg',q));
              };
              im.onerror=function(){res(null)};
              im.src=src;
            });
          }
          function setPhoto(src){
            return Promise.all([toJpeg(src,1600,0.85),toJpeg(src,800,0.6)]).then(function(r){
              if(!r[0]||!r[1]){DRAFT.msg='این عکس باز نشد. عکس دیگری انتخاب کن.';DRAFT.err=true;render();return}
              DRAFT.photos.push({big:r[0],small:r[1]});DRAFT.msg='عکس آماده است. می‌توانی تا سه عکس بگذاری، بعد آن‌ها را بخوانی یا متن را خودت تایپ کنی.';DRAFT.err=false;render();
            });
          }
          var stream=null;
          function closeCam(){
            if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
            $('cam').hidden=true;$('cam-v').srcObject=null;
          }
          function openCam(){
            var cam=$('cam'),msg=$('cam-msg');
            msg.textContent='برگه را کامل و صاف داخل کادر بگیر.';
            if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
              DRAFT.msg='دوربین در این دستگاه در دسترس نیست. از گالری عکس انتخاب کن یا برنامه را تایپ کن.';DRAFT.err=true;render();return;
            }
            navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false}).then(function(s){
              stream=s;var v=$('cam-v');v.srcObject=s;cam.hidden=false;
              var p=v.play&&v.play();if(p&&p.catch)p.catch(function(){});
            }).catch(function(){
              DRAFT.msg='اجازه‌ی دوربین داده نشد. از تنظیمات گوشی اجازه‌ی دوربین را برای این برنامه روشن کن، یا از گالری عکس انتخاب کن، یا برنامه را تایپ کن.';
              DRAFT.err=true;render();
            });
          }
          $('cam-x').addEventListener('click',closeCam);
          $('cam-go').addEventListener('click',function(){
            var v=$('cam-v');
            if(!v.videoWidth){return}
            var c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
            c.getContext('2d').drawImage(v,0,0);
            var src=c.toDataURL('image/jpeg',0.92);
            closeCam();setPhoto(src);
          });
          $('pick').addEventListener('change',function(){
            var f=this.files&&this.files[0];this.value='';
            if(!f)return;
            var url=URL.createObjectURL(f);
            setPhoto(url).then(function(){try{URL.revokeObjectURL(url)}catch(e){}});
          });

          var PROMPT='این عکس‌ها (یک تا سه عکس) صفحه‌های یک برنامه‌ی تمرین باشگاهی دست‌نویس به فارسی است. آن را فقط به متن ساده و با این قالب بنویس، بدون هیچ توضیح اضافه:\n\n'+
          'روز ۱: نام روز یا عضله\nنام حرکت ۴×۱۰\nنام حرکت اول / نام حرکت دوم ۳×۱۲+۱۰\n\n'+
          'قواعد:\n- هر خط یک حرکت است. ست و تکرار را به شکل ست×تکرار بنویس.\n- علامت / بین دو حرکت یعنی سوپرست.\n'+
          '- اگر کنار حرکت چیزی مثل ۱۰-۱۰ نوشته شده، یعنی دو حالت پشت‌سر هم؛ آن را ۱۰+۱۰ بنویس.\n'+
          '- روزها را با خط جداکننده یا تغییر گروه عضلانی تشخیص بده. اگر مشخص نبود همه را یک روز بگذار.\n'+
          '- هر جا مطمئن نیستی، آخر همان خط علامت ؟ بگذار.\n- اگر چند عکس هست، همه‌ی آن‌ها را به ترتیب و یک‌جا در یک متن بنویس.\n- اگر فقط بخشی از برنامه در عکس است همان را بنویس.';

          function aiRead(){
            var D=DRAFT;
            if(!DB.apiKey){D.msg='کلید API ذخیره نشده است. آن را در بخش «برنامه‌ها» وارد کن یا برنامه را تایپ کن.';D.err=true;render();return}
            if(navigator.onLine===false){D.msg='اینترنت وصل نیست. برنامه را تایپ کن یا بعدا دوباره امتحان کن.';D.err=true;render();return}
            D.busy=true;D.msg='';D.err=false;render();
            var content=D.photos.map(function(ph){return {type:'image',source:{type:'base64',media_type:'image/jpeg',data:ph.big.split(',')[1]}}});
            content.push({type:'text',text:PROMPT});
            fetch('https://api.anthropic.com/v1/messages',{
              method:'POST',
              headers:{'content-type':'application/json','x-api-key':DB.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
              body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:3500,messages:[{role:'user',content:content}]})
            }).then(function(r){
              if(!r.ok)return r.text().then(function(t){var e=new Error('http');e.status=r.status;e.body=t;throw e});
              return r.json();
            }).then(function(j){
              var t=(j.content||[]).map(function(c){return c.text||''}).join('\n').trim();
              D.busy=false;
              if(!t){D.msg='چیزی خوانده نشد. برنامه را تایپ کن.';D.err=true}
              else{D.text=t;D.msg='خوانده شد. متن را با عکس مقایسه و اصلاح کن، بعد «ساخت برنامه» را بزن.';D.err=false}
              render();
            }).catch(function(e){
              D.busy=false;D.err=true;
              if(e&&e.status===401)D.msg='کلید API معتبر نیست. آن را در بخش «برنامه‌ها» دوباره وارد کن.';
              else if(e&&(e.status===429||e.status===529))D.msg='سرویس الان شلوغ است. چند دقیقه بعد امتحان کن یا برنامه را تایپ کن.';
              else if(e&&e.status)D.msg='خواندن عکس انجام نشد (خطای '+fa(e.status)+'). برنامه را تایپ کن.';
              else D.msg='به اینترنت یا سرویس وصل نشد. برنامه را تایپ کن یا بعدا دوباره امتحان کن.';
              render();
            });
          }

          /* ---------- actions ---------- */
          function newProgram(name,days,photos){
            var now=Date.now(),old=cur();
            if(old&&!old.archived)old.archived=now;
            var np={id:'p'+now,name:name,created:now,archived:null,photos:photos||[],days:days};
            DB.programs.push(np);DB.activeId=np.id;DB.dayIx=0;
          }
          function go(v){view=v;armed='';window.scrollTo(0,0);render()}

          app.addEventListener('click',function(e){
            var t=e.target.closest('[data-act]');if(!t)return;
            var a=t.dataset.act,i=+t.dataset.i,its,it;
            switch(a){
              case 'nav':
                if(t.dataset.v==='train')go('train');else if(view==='train')go('programs');
                return;
              case 'day':
                DB.dayIx=i;edit=edit;stopRest();save();render();return;
              case 'mode':
                DB.mode=t.dataset.m;save();render();return;
              case 'reset':{
                var pre={},pid=cur().id+'|'+DB.dayIx+'|';
                Object.keys(DB.done).forEach(function(k){if(k.indexOf(pid)!==0)pre[k]=DB.done[k]});
                DB.done=pre;stopRest();save();render();return}
              case 'edit':
                edit=!edit;armed='';render();return;
              case 'set':{
                var s=+t.dataset.s;its=items();it=its[i];var c=doneOf(i);
                if(s===c){
                  ensureAudio();
                  DB.done[dkey(i)]=c+1;
                  var lastSet=(c+1)>=it.sets,lastEx=i===its.length-1,next=null;
                  if(!lastSet)next='ست '+fa(c+2)+' از '+it.n;
                  else if(!lastEx)next=its[i+1].n;
                  if(lastSet&&lastEx)stopRest('تمرین امروز تمام شد','خسته نباشی');
                  else startRest(restOf(it),'ست '+fa(c+1),next);
                  save();render();
                }else if(s<c){
                  DB.done[dkey(i)]=s;stopRest();save();render();
                }
                return}
              case 'addDay':{
                var p=cur();p.days.push({name:'روز جدید',items:[]});DB.dayIx=p.days.length-1;save();render();return}
              case 'delDay':{
                var pr=cur();
                if(pr.days.length<2)return;
                if(!arm('delday')){render();return}
                pr.days.splice(DB.dayIx,1);DB.dayIx=Math.max(0,DB.dayIx-1);armed='';save();render();return}
              case 'addEx':
                items().push({n:'حرکت جدید',sets:3,reps:'10',rest:75});save();render();
                setTimeout(function(){var el=$('f'+(items().length-1)+'n');if(el){el.focus();el.select()}},0);
                return;
              case 'delEx':
                if(!arm('del'+i)){render();return}
                items().splice(i,1);armed='';save();render();return;
              case 'up':
                its=items();if(i>0){var x=its[i-1];its[i-1]=its[i];its[i]=x;save();render()}return;
              case 'down':
                its=items();if(i<its.length-1){var y=its[i+1];its[i+1]=its[i];its[i]=y;save();render()}return;
              case 'new':
                DRAFT=freshDraft();go('new');return;
              case 'back':
                go(view==='train'?'train':'programs');return;
              case 'cam':
                if(DRAFT.photos.length>=3){DRAFT.msg='حداکثر سه عکس می‌شود گذاشت. برای عوض کردن، یکی را پاک کن.';DRAFT.err=true;render();return}
                ensureAudio();openCam();return;
              case 'pick':
                if(DRAFT.photos.length>=3){DRAFT.msg='حداکثر سه عکس می‌شود گذاشت. برای عوض کردن، یکی را پاک کن.';DRAFT.err=true;render();return}
                $('pick').click();return;
              case 'rmPhoto':DRAFT.photos.splice(i,1);DRAFT.msg='';render();return;
              case 'ai':aiRead();return;
              case 'make':{
                var days=parsePlan(DRAFT.text);
                if(!days.length){DRAFT.msg='حداقل یک حرکت لازم است. هر خط را به شکل «نام حرکت ۴×۱۰» بنویس.';DRAFT.err=true;render();return}
                var nm=(DRAFT.name||'').trim()||monthName(Date.now());
                newProgram(nm,days,DRAFT.photos.map(function(x){return x.small}));
                DRAFT=freshDraft();edit=false;stopRest();
                if(!save()){/* storage full even without photos: keep running in memory */}
                go('train');return}
              case 'viewP':go('view:'+t.dataset.id);return;
              case 'activate':{
                var tgt=null;DB.programs.forEach(function(x){if(x.id===t.dataset.id)tgt=x});
                if(!tgt)return;
                var oldp=cur();if(oldp&&!oldp.archived)oldp.archived=Date.now();
                tgt.archived=null;DB.activeId=tgt.id;DB.dayIx=0;stopRest();save();go('train');return}
              case 'delP':
                if(!arm('p'+t.dataset.id)){render();return}
                DB.programs=DB.programs.filter(function(x){return x.id!==t.dataset.id});armed='';save();render();return;
              case 'saveKey':{
                var v=($('akey').value||'').trim();DB.apiKey=v;save();
                $('kinfo').textContent=v?'کلید ذخیره شد.':'کلید پاک شد.';return}
            }
          });
          app.addEventListener('change',function(e){
            var el=e.target,f=el.getAttribute('data-f');
            if(el.id==='dn'){curDay().name=el.value.trim()||curDay().name;save();render();return}
            if(!f)return;
            var i=+el.getAttribute('data-i'),it=items()[i],v=el.value;
            if(f==='n'){it.n=v.trim()||it.n}
            else if(f==='reps'){var r=lat(v).replace(/[^0-9+\-]/g,'');if(r){it.reps=r;var np=r.split('+').length;if(!/\//.test(it.n))it.tag=np===2?'دو حالته':(np>=3?'سه حالته':undefined)}}
            else{
              var n=parseInt(lat(v),10);
              if(!isNaN(n)){if(f==='sets')it.sets=Math.min(12,Math.max(1,n));else it.rest=Math.min(600,Math.max(15,n))}
            }
            delete it.q;
            if(!it.tag)delete it.tag;
            save();render();
          });
          app.addEventListener('input',function(e){
            var el=e.target;
            if(el.id==='nname'){DRAFT.name=el.value}
            else if(el.id==='ntext'){
              DRAFT.text=el.value;
              var inf=planInfo(el.value),box=$('ninfo');
              if(box){box.textContent=inf.t;box.className='info '+inf.cls}
            }
          });

          window.__back=function(){
            if(!$('cam').hidden){closeCam();return true}
            if(view==='train')return false;
            if(view==='new'||view.indexOf('view:')===0){go('programs');return true}
            go('train');return true;
          };

          render();
          setIdle();
          })();
          </script>
          </body>
          </html>
          __GYM_EOF__

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GymPlan-APK
          path: build/outputs/apk/debug/*.apk
